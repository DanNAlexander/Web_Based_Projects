
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manga Reader Enhanced</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    #viewer { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
    img { max-width: 100vw; max-height: 100vh; object-fit: contain; transition: transform 0.2s ease; }
    button { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); border: none; color: white; font-size: 2rem; padding: 0.5em 1em; cursor: pointer; z-index: 10; }
    #prev { left: 10px; }
    #next { right: 10px; }
    #toolbar { background: #222; padding: 0.5em; text-align: center; }
    select { background: #333; color: #fff; padding: 0.3em; border: none; }
  </style>
</head>
<body>
  <div id="toolbar">
    Chapter:
    <select id="chapterSelect"></select>
  </div>
  <div id="viewer">
    <button id="prev">⟨</button>
    <img id="page" src="" alt="Manga Page" />
    <button id="next">⟩</button>
  </div>
<script>
const chapters = {
  chapter1: ["001.jpg", "002.jpg", "003.jpg"],
  chapter2: ["001.jpg", "002.jpg"]
};

const basePath = "chapters";
const chapterSelect = document.getElementById("chapterSelect");
const img = document.getElementById("page");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
let currentChapter = "chapter1";
let currentIndex = 0;

function populateChapters() {
  for (const ch in chapters) {
    const opt = document.createElement("option");
    opt.value = ch;
    opt.textContent = ch;
    chapterSelect.appendChild(opt);
  }
}

function loadPage(index) {
  const pages = chapters[currentChapter];
  if (index < 0 || index >= pages.length) return;
  const path = `${basePath}/${currentChapter}/${pages[index]}`;
  img.src = path;
  currentIndex = index;
}

function changeChapter(ch) {
  currentChapter = ch;
  currentIndex = 0;
  loadPage(currentIndex);
}

prev.onclick = () => loadPage(currentIndex - 1);
next.onclick = () => loadPage(currentIndex + 1);

window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") next.click();
  if (e.key === "ArrowLeft") prev.click();
});

chapterSelect.onchange = (e) => changeChapter(e.target.value);

populateChapters();
changeChapter(currentChapter);
</script>
</body>
</html>
