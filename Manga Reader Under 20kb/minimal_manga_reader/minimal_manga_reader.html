
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mini Manga Reader</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
  #viewer { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
  button { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); border: none; color: #fff; font-size: 2rem; padding: 0.5em 1em; cursor: pointer; }
  #prev { left: 10px; }
  #next { right: 10px; }
</style>
</head>
<body>
<div id="viewer">
  <button id="prev">⟨</button>
  <img id="page" src="" alt="Page" />
  <button id="next">⟩</button>
</div>
<script>
const pages = [
  "chapters/chapter1/001.jpg",
  "chapters/chapter1/002.jpg",
  "chapters/chapter1/003.jpg"
];
let current = 0;
const img = document.getElementById("page");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

function loadPage(i) {
  if (i < 0 || i >= pages.length) return;
  img.src = pages[i];
  current = i;
}

prev.onclick = () => loadPage(current - 1);
next.onclick = () => loadPage(current + 1);
window.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") next.click();
  if (e.key === "ArrowLeft") prev.click();
});
loadPage(current);
</script>
</body>
</html>
